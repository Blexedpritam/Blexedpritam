<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF Background Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
        }

        /* GIF ke saath Background Section */
        .banner-section {
            background-image: url('https://github.com/Blexedpritam/Blexedpritam/raw/main/assets/banner.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            width: 100%;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Content ke upar */
        .banner-content {
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 30px 50px;
            border-radius: 10px;
        }

        .banner-content h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .banner-content p {
            font-size: 1.2rem;
        }

        /* Rest of the page */
        .content-section {
            padding: 40px 20px;
            text-align: center;
            background: #f5f5f5;
        }

        .content-section h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
        }

        .content-section p {
            font-size: 1rem;
            color: #666;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .banner-section {
                height: 300px;
            }

            .banner-content h1 {
                font-size: 1.8rem;
            }

            .banner-content p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- GIF ko Background-Image ke roop mein -->
    <div class="banner-section">
        <div class="banner-content">
            <h1>👋 Welcome!</h1>
            <p>Your GIF is now showing as a background!</p>
        </div>
    </div>

    <!-- Rest of Content -->
    <div class="content-section">
        <h2>About This Example</h2>
        <p>
            Yeh example dikhata hai ki kaise ek GIF ko CSS background-image ke roop mein use kiya jaye.
            Tumhare banner.gif ko GitHub se directly access kiya ja raha hai.
        </p>
    </div>

</body>
</html>
